<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Calculator — Card Style Reference</title>
<style>
  :root{
    --bg:#141414;
    --card-bg:#1c1c1c;
    --card-bg-2:#1a1a1a;
    --border:rgba(255,255,255,.07);
    --border-strong:rgba(255,255,255,.10);
    --shadow-outer:0 10px 24px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35);
    --inset-top:inset 0 1px 0 rgba(255,255,255,.06);
    --inset-bottom:inset 0 -14px 22px rgba(0,0,0,.35);
    --radius-lg:22px;
    --radius-md:20px;
    --text:#f2f2f2;
    --text-dim:rgba(255,255,255,.55);
    --danger:#e0303d;
    --accent:#2e8bff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    color:var(--text);
    padding:28px 18px 60px;
    display:flex;
    justify-content:center;
  }
  .screen{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px;}

  /* ---------- Hero identity card ---------- */
  .id-card{
    position:relative;
    height:230px;
    border-radius:var(--radius-lg);
    background:
      radial-gradient(120% 140% at 8% 0%, #222 0%, #1a1a1a 45%, #151515 100%);
    border:1px solid var(--border-strong);
    box-shadow:var(--shadow-outer), var(--inset-top);
    overflow:hidden;
  }
  .id-card svg.pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.55;}
  .id-card .id-text{
    position:absolute;
    top:34px; left:34px;
    text-align:left;
    direction:ltr;
    color:rgba(255,255,255,.16);
    font-size:14px;
    letter-spacing:.14em;
    line-height:1.5;
    font-weight:600;
  }
  .id-card .id-text .arrows{
    color:rgba(255,255,255,.16);
    letter-spacing:2px;
    margin-left:6px;
  }
  .id-card .dots{
    position:absolute; top:26px; right:26px;
    display:flex; gap:6px;
  }
  .id-card .dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);}
  .id-card .chevron{
    position:absolute;
    color:rgba(255,255,255,.22);
    font-size:14px;
  }
  .id-card .chevron.left{bottom:18px;left:18px;transform:scaleX(-1);}
  .id-card .chevron.right{bottom:18px;right:18px;}

  /* ---------- Icon-grid cards ---------- */
  .panel{
    border-radius:var(--radius-md);
    background:linear-gradient(180deg, var(--card-bg) 0%, var(--card-bg-2) 100%);
    border:1px solid var(--border);
    box-shadow:var(--shadow-outer), var(--inset-top);
    padding:26px 10px 22px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:6px 4px;
    text-align:center;
  }
  .icon-wrap{
    width:56px;height:56px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);
  }
  .icon-wrap.danger{color:var(--danger);}
  .icon-wrap svg{width:34px;height:34px;}
  .cell .label{font-size:14.5px;font-weight:600;color:var(--text);}

  /* ---------- Floating add button ---------- */
  .fab-row{display:flex;padding-top:4px;}
  .fab{
    width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card-bg);
    border:1px solid var(--border-strong);
    box-shadow:var(--shadow-outer), var(--inset-top);
    color:var(--accent);
  }
  .fab svg{width:24px;height:24px;}

  .caption{
    text-align:center;color:var(--text-dim);font-size:12px;margin-top:-8px;
  }
</style>
</head>
<body>
<div class="screen">

  <!-- Hero identity card -->
  <div class="id-card">
    <svg class="pattern" viewBox="0 0 400 230" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="rgba(255,255,255,.14)" stroke-width="1">
        <circle cx="10" cy="210" r="40" stroke-dasharray="2 4"/>
        <circle cx="10" cy="210" r="62" stroke-dasharray="1 5"/>
        <circle cx="10" cy="210" r="86" stroke-dasharray="3 3"/>
        <circle cx="10" cy="210" r="110"/>
        <path d="M10 210 L70 130 L70 90 L110 40" stroke-dasharray="2 4"/>
        <path d="M40 230 L100 170 L170 170" stroke-dasharray="2 5"/>
        <path d="M170 170 L230 110 L230 70" />
        <rect x="60" y="150" width="14" height="10" transform="rotate(20 60 150)"/>
        <rect x="90" y="120" width="16" height="10" transform="rotate(20 90 120)"/>
        <polygon points="150,180 178,164 206,180 206,212 178,228 150,212" stroke-dasharray="3 3"/>
        <polygon points="230,150 258,134 286,150 286,182 258,198 230,182" stroke-dasharray="3 3"/>
        <path d="M206 196 L286 150" stroke-dasharray="1 4"/>
        <circle cx="206" cy="196" r="3" fill="rgba(255,255,255,.18)" stroke="none"/>
        <path d="M286 150 L330 100" />
      </g>
    </svg>
    <div class="dots"><span></span><span></span></div>
    <div class="id-text"><span class="arrows">▶▶▶▶▶▶▶▶▶</span> SEPEHR<br>GOODARZI</div>
    <span class="chevron left">◀</span>
    <span class="chevron right">◀</span>
  </div>

  <!-- Row 1 -->
  <div class="panel">
    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </div>
      <div class="label">قرض</div>
    </div>
    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 10h16"/><path d="M5 21V10"/><path d="M19 21V10"/><path d="M9 21v-6h6v6"/><path d="M12 3l9 7H3l9-7z"/></svg>
      </div>
      <div class="label">اقساط</div>
    </div>
    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="15" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
      </div>
      <div class="label">درآمد ثابت</div>
    </div>
  </div>

  <!-- Row 2 -->
  <div class="panel">
    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5a1 1 0 0 0 1 1h5"/><path d="M6 21h9a2 2 0 0 0 2-2V8l-6-6H6a2 2 0 0 0-2 2v3"/><path d="M2 15h8"/><path d="M7 12l3 3-3 3"/></svg>
      </div>
      <div class="label">خروجی</div>
    </div>
    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 17v-5h5"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <div class="label">بازخوانی</div>
    </div>
    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
      </div>
      <div class="label">پشتیبان‌گیری</div>
    </div>
  </div>

  <!-- Row 3 (danger) -->
  <div class="panel">
    <div class="cell">
      <div class="icon-wrap danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </div>
      <div class="label">سطل زباله</div>
    </div>
    <div class="cell">
      <div class="icon-wrap danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M17 16l4 4m0-4l-4 4"/></svg>
      </div>
      <div class="label">حذف کلی</div>
    </div>
    <div class="cell">
      <div class="icon-wrap danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M15 16l4 4m0-4l-4 4"/></svg>
      </div>
      <div class="label">حذف ماه</div>
    </div>
  </div>

  <div class="fab-row">
    <div class="fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <div class="caption">Style reference — colors, radius and shadow tokens only; not the production markup</div>
</div>
</body>
</html>
