  </script>

  <div class="modal-overlay" id="subjectsModal" style="display:none;" onclick="if(event.target===this)closeSubjectsModal();">
    <div class="modal-box" onclick="event.stopPropagation();">
      <div class="modal-title">پروژه‌ها</div>
      <div id="subjectsList" style="max-height:40vh;overflow-y:auto;margin-bottom:10px;"></div>
      <!-- ۱.۴.۳: فیلد «… جدید» زیر آخرین مورد، با آیکون بعلاوه جلویش (مثل نام بانک دلخواه)؛ دکمهٔ افزودن/بستن نیست -->
      <div class="hk-newf"><input id="subjectNewName" class="family-input hk-newf-in" placeholder="پروژه جدید (مثلاً: سهراب/ساختمان آسمان)" dir="rtl" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();addSubjectFromModal();}"><button type="button" class="hk-newf-add" aria-label="افزودن پروژه" onclick="addSubjectFromModal()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    </div>
  </div>


  <div class="modal-overlay" id="projectReportModal" style="display:none;" onclick="if(event.target===this)closeProjectReportModal();">
    <div class="modal-box" onclick="event.stopPropagation();">
      <div class="modal-title" id="projectReportTitle">گزارش موضوع</div>
      <div id="projectReportBody"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button type="button" class="modal-btn no" onclick="closeProjectReportModal()">بستن</button>
      </div>
    </div>
  </div>

  <div id="app-menu-layer" aria-hidden="true"></div>
</body>
</html>
