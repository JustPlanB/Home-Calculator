  </script>

  <div class="modal-overlay" id="subjectsModal" style="display:none;" onclick="if(event.target===this)closeSubjectsModal();">
    <div class="modal-box" onclick="event.stopPropagation();">
      <div class="modal-title">پروژه‌ها</div>
      <div id="subjectsList" style="max-height:40vh;overflow-y:auto;margin-bottom:10px;"></div>
      <label class="family-label">پروژه جدید</label>
      <input id="subjectNewName" class="family-input" placeholder="مثلاً: سهراب/ساختمان آسمان" dir="rtl" style="margin-bottom:8px;">
      <div style="display:flex;gap:8px;">
        <button type="button" class="modal-btn primary" onclick="addSubjectFromModal()">افزودن</button>
        <button type="button" class="modal-btn" onclick="closeSubjectsModal()">بستن</button>
      </div>
    </div>
  </div>


  <div class="modal-overlay" id="projectReportModal" style="display:none;" onclick="if(event.target===this)closeProjectReportModal();">

      <div style="display:flex;gap:8px;margin-top:12px;">
        <button type="button" class="modal-btn no" onclick="closeProjectReportModal()">بستن</button>
      </div>
    </div>
  </div>

  <div id="app-menu-layer" aria-hidden="true"></div>
</body>
