      <span class="lock-bio-label">ورود با اثرانگشت</span>

  <div id="pinSetupOverlay" aria-hidden="true">
    <div class="pin-box">
      <h3 id="pinSetupTitle">تعیین رمز</h3>

      <div class="pin-input-wrap">
        <input id="pinSetupInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" />
        <button type="button" class="lock-eye-btn pin-eye" id="pinSetupEye" aria-label="نمایش رمز">
          <svg class="eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.9 21.9 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/></svg>
          <svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="pin-actions">
        <button type="button" class="pin-ok" id="pinSetupOk">تأیید</button>
        <button type="button" class="pin-cancel" id="pinSetupCancel">انصراف</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="securityModal">
    <div class="modal-box" style="max-width:380px;text-align:right;">
      <div style="font-weight:800;font-size:1.1rem;margin-bottom:8px;">امنیت و قفل برنامه</div>
      <div class="sec-status" id="secStatusText">قفل برنامه خاموش است</div>

        <div class="sec-label">قفل خودکار</div>
        <div class="sec-autolock-wrap" id="secAutoLockWrap">
          <button type="button" class="sec-autolock-btn" id="secAutoLockBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="secAutoLockLabel">بلافاصله</span>
          </button>
          <div class="sec-autolock-list" id="secAutoLockList" role="listbox" hidden>

            <button type="button" class="sec-autolock-opt" data-v="300" role="option">بعد از ۵ دقیقه</button>

    </div>
  </div>
