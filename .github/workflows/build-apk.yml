name: Build Hesab Ketab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  # ساخت Release و به‌روزرسانی شاخهٔ update-feed (فقط در بیلد امضاشدهٔ main)
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # شمارهٔ نسخهٔ اندروید (versionCode) هر بار بالاتر می‌رود — لازمهٔ آپدیت در استور
      HK_VERSION_CODE: ${{ github.run_number }}
      # امضای نسخهٔ انتشار (اختیاری): اگر این Secretها تعریف نشده باشند، فقط APK دیباگ مثل قبل ساخته می‌شود
      HK_KEYSTORE_BASE64: ${{ secrets.HK_KEYSTORE_BASE64 }}
      HK_KEYSTORE_PASSWORD: ${{ secrets.HK_KEYSTORE_PASSWORD }}
      HK_KEY_ALIAS: ${{ secrets.HK_KEY_ALIAS }}
      HK_KEY_PASSWORD: ${{ secrets.HK_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Syntax-check patch scripts
        run: |
          node --check scripts/patch-android.js
          node --check scripts/fix-android-lock.js
          node --check scripts/patch-android-release.js
          node --check scripts/patch-android-icons.js
          node --check scripts/make-update-feed.js

      - name: Decode release keystore (only when secrets exist)
        if: ${{ env.HK_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$HK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Patch Android SMS receiver
        run: npm run patch:android

      - name: Remove lock-screen bypass flags
        run: node scripts/fix-android-lock.js

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesab-ketab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release (APK + AAB for stores)
        if: ${{ env.HK_KEYSTORE_FILE != '' }}
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload release
        if: ${{ env.HK_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hesab-ketab-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # بروزرسانی داخل اپ: APK امضاشده در Releases (پیوند ثابت latest) + version.json در شاخهٔ update-feed
      - name: Publish release and update feed (main + signed only)
        if: ${{ env.HK_KEYSTORE_FILE != '' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          VN=$(node -p "require('./package.json').version")
          TAG="v${VN}-b${HK_VERSION_CODE}"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hesab-ketab.apk"
          node scripts/make-update-feed.js "$RUNNER_TEMP/version.json"
          node -e "const n=(require('./version.json').notes||[]);require('fs').writeFileSync(process.env.RUNNER_TEMP+'/notes.md',(n.length?n.map(x=>'- '+x).join('\n'):'بهبودها و رفع اشکال')+'\n')"
          gh release create "$TAG" "$RUNNER_TEMP/hesab-ketab.apk" "$RUNNER_TEMP/version.json" \
            --repo "$REPO" --title "حساب‌کتاب ${VN} (بیلد ${HK_VERSION_CODE})" --notes-file "$RUNNER_TEMP/notes.md" --latest
          if ! gh api "repos/$REPO/branches/update-feed" >/dev/null 2>&1; then
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/update-feed -f sha="$GITHUB_SHA" >/dev/null
          fi
          SHA=$(gh api "repos/$REPO/contents/version.json?ref=update-feed" --jq .sha 2>/dev/null || true)
          CONTENT=$(base64 -w0 "$RUNNER_TEMP/version.json")
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/$REPO/contents/version.json" -f message="Update feed: build ${HK_VERSION_CODE}" -f branch=update-feed -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api -X PUT "repos/$REPO/contents/version.json" -f message="Update feed: build ${HK_VERSION_CODE}" -f branch=update-feed -f content="$CONTENT" >/dev/null
          fi
          echo "Published $TAG"
