name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v5

      - name: نصب Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: نصب Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: بررسی نسخه Java
        run: |
          java -version
          javac -version

      - name: نصب وابستگی‌ها
        run: npm install

      - name: ساخت پوشه www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: نصب Android برای Capacitor
        run: npm install @capacitor/android

      - name: ایجاد پروژه Android
        run: npx cap add android

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: ساخت APK آزمایشی
        working-directory: android
        run: ./gradlew clean assembleDebug --stacktrace

      - name: آماده‌سازی APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: Home-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
