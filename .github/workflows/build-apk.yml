name: Build Hesab Ketab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# حداقل دسترسی: ساخت و امضا فقط با دسترسی خواندن؛ دسترسی نوشتن فقط برای job انتشار (پایین)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    env:
      # شمارهٔ نسخهٔ اندروید (versionCode) هر بار بالاتر می‌رود — لازمهٔ آپدیت در استور
      HK_VERSION_CODE: ${{ github.run_number }}
      # امضای نسخهٔ انتشار (اختیاری): اگر این Secretها تعریف نشده باشند، فقط APK دیباگ مثل قبل ساخته می‌شود
      HK_KEYSTORE_BASE64: ${{ secrets.HK_KEYSTORE_BASE64 }}
      HK_KEYSTORE_PASSWORD: ${{ secrets.HK_KEYSTORE_PASSWORD }}
      HK_KEY_ALIAS: ${{ secrets.HK_KEY_ALIAS }}
      HK_KEY_PASSWORD: ${{ secrets.HK_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Syntax-check patch scripts
        run: |
          node --check scripts/patch-android.js
          node --check scripts/fix-android-lock.js
          node --check scripts/patch-android-release.js
          node --check scripts/patch-android-icons.js
          node --check scripts/make-update-feed.js
          bash -n scripts/publish-release.sh

      - name: Decode release keystore (only when secrets exist)
        id: keystore
        if: ${{ env.HK_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$HK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Patch Android SMS receiver
        run: npm run patch:android

      - name: Remove lock-screen bypass flags
        run: node scripts/fix-android-lock.js

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # APK دیباگ (debuggable) دیگر ساخته و به‌صورت artifact عمومی بارگذاری نمی‌شود؛
      # برای بررسی کامپایل بدون Secret، workflow «Tests» یک release بدون امضا می‌سازد.

      - name: Build signed release (APK + AAB for stores)
        if: ${{ env.HK_KEYSTORE_FILE != '' }}
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify release APK (web assets identical, not debuggable)
        if: ${{ env.HK_KEYSTORE_FILE != '' }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          SRC=$(sha256sum index.html | cut -d' ' -f1)
          IN=$(unzip -p "$APK" assets/public/index.html | sha256sum | cut -d' ' -f1)
          echo "index.html source=$SRC apk=$IN"
          test "$SRC" = "$IN"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.txt"
          if grep -q 'android:debuggable.*=.*true\|debuggable(0x0101000f)=(type 0x12)0xffffffff' "$RUNNER_TEMP/manifest.txt"; then echo "release APK is debuggable"; exit 1; fi
          echo "release APK is not debuggable"

      - name: Upload release
        if: ${{ env.HK_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hesab-ketab-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # بروزرسانی داخل اپ: APK امضاشده در Releases (پیوند ثابت latest) + version.json در شاخهٔ update-feed.
  # تنها job با دسترسی نوشتن؛ فقط روی main و فقط وقتی APK امضاشده ساخته شده باشد. به کلید امضا دسترسی ندارد.
  publish:
    needs: build
    if: ${{ needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HK_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download signed release from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hesab-ketab-release
          path: ${{ runner.temp }}/release

      - name: Publish release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          export APK_SRC=$(find "$RUNNER_TEMP/release" -name app-release.apk | head -1)
          bash scripts/publish-release.sh
