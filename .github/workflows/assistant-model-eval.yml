name: Assistant model eval (manual)

# فقط دستی (workflow_dispatch): مدل واقعی دستیار را با همان موتور و تنظیم‌های برنامه روی Chromium بارگذاری می‌کند،
# چند سؤال فارسی ساختگی می‌پرسد و اعتبار JSON، درستی ابزار و زمان پاسخ را در خلاصهٔ اجرا می‌نویسد.
# هیچ Secretی خوانده نمی‌شود و چیزی منتشر یا امضا نمی‌شود. بخشی از تست‌های همیشگی نیست.
on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "GGUF model URL"
        required: false
        type: string
        default: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install test dependencies (isolated from the app)
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Download model
        env:
          MODEL_URL: ${{ inputs.model_url }}
        run: |
          mkdir -p tests/out
          curl -fL --retry 3 --retry-delay 5 -o tests/out/model.gguf "$MODEL_URL"
          ls -l tests/out/model.gguf
      - name: Run model eval (synthetic questions only)
        working-directory: tests
        env:
          HK_MODEL_FILE: out/model.gguf
        run: node model-eval/run.js
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-eval
          path: tests/out/model-eval.md
          retention-days: 7
          if-no-files-found: ignore
