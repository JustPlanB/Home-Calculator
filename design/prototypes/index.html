<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب‌کتاب سه طرح</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap">
<style>
/* صفحهٔ نمایش: نوار انتخاب طرح/صفحه/حالت + قاب گوشی (۳۹۰×۸۴۴) روی صفحهٔ بزرگ؛ روی گوشی تمام‌عرض.
   هر طرح توکن‌های خودش را روی .phone[data-d] دارد؛ حالت تیره با data-m="dark". */
:root {
  --page: #e6e8ec; --page-fg: #1d232b; --chip: #ffffff; --chip-fg: #1d232b; --chip-on: #1d232b; --chip-on-fg: #ffffff; --line: #cfd4db;
  --f-ui: 'Vazirmatn', 'Tahoma', sans-serif; --f-naskh: 'Noto Naskh Arabic', 'Vazirmatn', 'Tahoma', serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #15181d; --page-fg: #e7eaee; --chip: #22262d; --chip-fg: #e7eaee; --chip-on: #e7eaee; --chip-on-fg: #15181d; --line: #343a43; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #15181d; --page-fg: #e7eaee; --chip: #22262d; --chip-fg: #e7eaee; --chip-on: #e7eaee; --chip-on-fg: #15181d; --line: #343a43; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--page-fg); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.seg { display: inline-flex; background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--chip-fg); padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
.note { text-align: center; font-size: 12.5px; opacity: .72; margin: 0 0 12px; padding-inline: 16px; }
.stage { display: flex; justify-content: center; padding-bottom: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.phone { width: 390px; max-width: 100%; height: 844px; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 0 0 10px #0d0f12, 0 30px 60px -20px rgba(0,0,0,.45); display: flex; flex-direction: column; }
.phone .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.phone .scroll::-webkit-scrollbar { display: none; }
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 14px; font-weight: 600; direction: ltr; }
@media (max-width: 460px) {
  .stage { padding-left: 0; padding-right: 0; padding-bottom: 0; }
  .phone { width: 100%; height: calc(100dvh - 104px); min-height: 640px; border-radius: 0; box-shadow: none; }
  .statusbar { display: none; }
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ============ طرح ۱ «دفتر»: مینیمال، خوانایی عدد، بی‌کارت؛ خط‌های مو و ستون مبلغ چپ‌چین ============ */
.phone[data-d="a"] {
  --bg: #fbfbfc; --fg: #14171c; --fg2: #59606b; --fg3: #8b929c; --rule: #e7e9ed; --soft: #f1f2f5;
  --accent: #2346c7; --inc: #3f9a5c; --exp: #dc2626; --pend: #5b5fc7; --pend-bg: #ecedfb;
  background: var(--bg); color: var(--fg); font-family: var(--f-ui);
}
.phone[data-d="a"][data-m="dark"] {
  --bg: #111317; --fg: #f2f3f5; --fg2: #a7adb7; --fg3: #737a85; --rule: #23262c; --soft: #1a1d22;
  --accent: #8ea6ff; --inc: #9ee858; --exp: #ff6b4a; --pend: #a9aefc; --pend-bg: #23254a;
}
.a-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 22px 0; }
.a-month { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; font-size: 15px; font-weight: 600; padding: 8px 0; cursor: pointer; }
.a-month svg { width: 16px; height: 16px; color: var(--fg3); }
.a-iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--fg2); border-radius: 12px; cursor: pointer; }
.a-iconbtn svg { width: 22px; height: 22px; }
.a-hero { padding: 26px 22px 22px; }
.a-hero .lab { font-size: 13px; color: var(--fg2); margin: 0 0 6px; }
.a-hero .bal { font-size: 44px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; margin: 0; }
.a-hero .bal small { font-size: 15px; font-weight: 500; color: var(--fg3); margin-right: 6px; letter-spacing: 0; }
.a-flow { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 22px 0 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.a-flow div { padding: 12px 0; display: flex; flex-direction: column; gap: 3px; }
.a-flow div + div { border-right: 1px solid var(--rule); padding-right: 14px; }
.a-flow span { font-size: 12px; color: var(--fg2); }
.a-flow b { font-size: 16px; font-weight: 600; }
.a-sec { padding: 22px 22px 6px; display: flex; align-items: baseline; justify-content: space-between; }
.a-sec h2 { font-size: 15px; font-weight: 700; margin: 0; }
.a-sec a, .a-sec button { font-size: 13px; color: var(--accent); background: none; border: 0; padding: 6px 0; cursor: pointer; font-weight: 600; text-decoration: none; }
.a-accts { list-style: none; margin: 0; padding: 0 22px; }
.a-accts li { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.a-accts li:last-child { border-bottom: 0; }
.a-accts .an { display: flex; flex-direction: column; gap: 2px; }
.a-accts .an small { font-size: 12px; color: var(--fg3); }
.a-accts .amt { font-weight: 600; }
.a-day { position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; justify-content: space-between; padding: 14px 22px 6px; font-size: 12.5px; color: var(--fg2); font-weight: 600; border-bottom: 1px solid var(--rule); }
.a-tx { list-style: none; margin: 0; padding: 0; }
.a-tx li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 13px 22px; border-bottom: 1px solid var(--rule); }
.a-tx .d { font-size: 15px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a-tx .m { font-size: 12.5px; color: var(--fg3); display: flex; gap: 10px; }
.a-tx .v { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: left; font-size: 16px; font-weight: 600; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.a-tx .v.inc { color: var(--inc); } .a-tx .v.exp { color: var(--exp); }
.a-pend { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--pend); }
.a-pend::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.6px solid currentColor; box-sizing: border-box; }
.a-tx li.is-pend .v > .ltr { opacity: .62; }
.a-search { margin: 6px 22px 0; display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 0 14px; height: 46px; color: var(--fg3); font-size: 15px; }
.a-search svg { width: 19px; height: 19px; flex: none; }
.a-filters { display: flex; gap: 22px; padding: 14px 22px 0; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.a-filters button { border: 0; background: none; padding: 10px 0 12px; font-size: 14px; color: var(--fg2); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.a-filters button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.a-filters em { font-style: normal; color: var(--fg3); font-weight: 500; margin-right: 4px; }
.a-sum { display: flex; justify-content: space-between; padding: 14px 22px; font-size: 13px; color: var(--fg2); }
.a-sum b { color: var(--fg); font-weight: 600; }
.a-nav { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--rule); background: var(--bg); padding: 6px 6px 18px; }
.a-nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--fg3); padding: 6px 0; cursor: pointer; min-height: 48px; }
.a-nav button svg { width: 23px; height: 23px; }
.a-nav button[aria-current="page"] { color: var(--fg); font-weight: 700; }
.a-nav .add span { width: 44px; height: 44px; border-radius: 14px; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.a-nav .add svg { width: 22px; height: 22px; }

/* ============ طرح ۲ «فیروزه»: گرم و آرام؛ نسخ برای عنوان‌ها، نقش گره در کارت موجودی، کاشی‌های نرم ============ */
.phone[data-d="b"] {
  --bg: #eef0ea; --surface: #fbfbf8; --fg: #1f2a28; --fg2: #5d6764; --fg3: #8b9491; --rule: #e1e4dc;
  --tq: #17706c; --tq-soft: #d7ebe7; --hero: #134e4b; --hero-fg: #f2f7f5; --hero-2: #9fd3cb;
  --inc: #3f9a5c; --exp: #dc2626; --pend: #a5640e; --pend-bg: #f8ead2; --ok: #17706c;
  background: var(--bg); color: var(--fg); font-family: var(--f-ui);
}
.phone[data-d="b"][data-m="dark"] {
  --bg: #121a19; --surface: #1a2423; --fg: #ecf1ef; --fg2: #a9b5b2; --fg3: #73807d; --rule: #253230;
  --tq: #5cc4b8; --tq-soft: #1d3a37; --hero: #0f3532; --hero-fg: #eef6f4; --hero-2: #7cc7bc;
  --inc: #9ee858; --exp: #ff6b4a; --pend: #f0b25a; --pend-bg: #3a2c16; --ok: #5cc4b8;
}
.b-top { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 4px; }
.b-greet { font-family: var(--f-naskh); font-size: 21px; font-weight: 700; margin: 0; }
.b-greet small { display: block; font-family: var(--f-ui); font-size: 12.5px; font-weight: 500; color: var(--fg2); margin-top: 2px; }
.b-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--tq-soft); color: var(--tq); display: grid; place-items: center; border: 0; cursor: pointer; }
.b-avatar svg { width: 22px; height: 22px; }
.b-hero { margin: 14px 16px 0; border-radius: 26px; background: var(--hero); color: var(--hero-fg); padding: 22px 22px 18px; position: relative; overflow: hidden; }
.b-hero .girih { position: absolute; inset: 0; opacity: .14; pointer-events: none; }
.b-hero > *:not(.girih) { position: relative; }
.b-hero .lab { font-size: 13px; opacity: .8; margin: 0; }
.b-hero .bal { font-size: 36px; font-weight: 700; margin: 6px 0 0; line-height: 1.15; }
.b-hero .bal small { font-size: 14px; font-weight: 500; opacity: .75; margin-right: 6px; }
.b-hero .row { display: flex; gap: 10px; margin-top: 18px; }
.b-hero .pill { flex: 1; background: rgba(255,255,255,.09); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.b-hero .pill span { font-size: 11.5px; opacity: .78; }
.b-hero .pill b { font-size: 15px; font-weight: 600; }
.b-hero .pill b.in { color: var(--hero-2); }
.b-h2 { font-family: var(--f-naskh); font-size: 17px; font-weight: 700; margin: 0; }
.b-sec { display: flex; justify-content: space-between; align-items: baseline; padding: 24px 22px 10px; }
.b-sec button { border: 0; background: none; color: var(--tq); font-size: 13px; font-weight: 600; padding: 6px 0; cursor: pointer; }
.b-due { margin: 0 16px; background: var(--surface); border-radius: 20px; padding: 6px 16px; }
.b-due-it { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.b-due-it + .b-due-it { border-top: 1px solid var(--rule); }
.b-due-it .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.b-due-it .t b { font-size: 14.5px; font-weight: 600; }
.b-due-it .t small { font-size: 12px; color: var(--fg3); }
.b-due-it .v { font-weight: 600; font-size: 15px; }
.b-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.b-tag.pend { color: var(--pend); background: var(--pend-bg); border: 1px dashed currentColor; }
.b-ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--tq-soft); color: var(--tq); }
.b-ico svg { width: 21px; height: 21px; }
.b-ico.inc { background: color-mix(in srgb, var(--inc) 16%, transparent); color: var(--inc); }
.b-ring { display: flex; gap: 18px; align-items: center; margin: 0 16px; background: var(--surface); border-radius: 20px; padding: 16px; }
.b-ring svg { width: 92px; height: 92px; flex: none; }
.b-ring ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.b-ring li { display: flex; justify-content: space-between; font-size: 13.5px; align-items: center; gap: 8px; }
.b-ring li i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-left: 7px; }
.b-day { padding: 18px 22px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.b-day b { font-family: var(--f-naskh); font-size: 15.5px; font-weight: 700; }
.b-day span { font-size: 12.5px; color: var(--fg3); }
.b-card { margin: 0 16px; background: var(--surface); border-radius: 20px; padding: 2px 14px; }
.b-tx { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.b-tx + .b-tx { border-top: 1px solid var(--rule); }
.b-tx .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.b-tx .t b { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-tx .t small { font-size: 12px; color: var(--fg3); display: flex; gap: 8px; align-items: center; }
.b-tx .v { text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-weight: 600; font-size: 15px; }
.b-tx .v.inc { color: var(--inc); } .b-tx .v.exp { color: var(--exp); }
.b-seal { width: 14px; height: 14px; color: var(--ok); }
.b-searchrow { display: flex; gap: 10px; padding: 8px 16px 0; }
.b-search { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; height: 48px; padding: 0 14px; color: var(--fg3); font-size: 14.5px; }
.b-search svg, .b-filterbtn svg { width: 19px; height: 19px; }
.b-filterbtn { width: 48px; height: 48px; border-radius: 16px; border: 0; background: var(--surface); color: var(--tq); display: grid; place-items: center; cursor: pointer; }
.b-chips { display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto; scrollbar-width: none; }
.b-chips button { border: 1px solid var(--rule); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--fg2); white-space: nowrap; cursor: pointer; min-height: 38px; }
.b-chips button[aria-pressed="true"] { background: var(--tq); border-color: var(--tq); color: var(--surface); }
.b-totals { display: flex; margin: 14px 16px 0; background: var(--tq-soft); border-radius: 18px; padding: 12px 16px; justify-content: space-between; font-size: 12.5px; color: var(--fg2); }
.b-totals div { display: flex; flex-direction: column; gap: 2px; }
.b-totals b { font-size: 15px; color: var(--fg); font-weight: 600; }
.b-nav { flex: none; padding: 8px 16px 18px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.b-nav nav { display: flex; justify-content: space-around; align-items: center; background: var(--surface); border-radius: 24px; height: 64px; box-shadow: 0 8px 24px -14px rgba(16, 40, 38, .5); }
.b-nav button { border: 0; background: none; color: var(--fg3); width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; cursor: pointer; }
.b-nav button svg { width: 23px; height: 23px; }
.b-nav button[aria-current="page"] { color: var(--tq); background: var(--tq-soft); }
.b-nav .add { background: var(--tq); color: var(--surface); width: 50px; height: 50px; border-radius: 50%; }

/* ============ طرح ۳ «پیشخوان»: داده‌محور، تیره‌اول؛ نمودار موجودی روزانه با پیش‌بینی، جریان نقدی، مانده پس از هر تراکنش ============ */
.phone[data-d="c"] {
  --bg: #f5f7fa; --surface: #ffffff; --fg: #0f1a2a; --fg2: #4b5a6e; --fg3: #8492a6; --rule: #e3e8ef; --grid: #eef2f6;
  --accent: #2563eb; --line: #2563eb; --area: rgba(37, 99, 235, .12);
  --inc: #3f9a5c; --exp: #dc2626; --pend: #7c3aed; --pend-bg: #efe7fd;
  background: var(--bg); color: var(--fg); font-family: var(--f-ui);
}
.phone[data-d="c"][data-m="dark"] {
  --bg: #0b1220; --surface: #121b2d; --fg: #e8eef7; --fg2: #9fb0c6; --fg3: #6a7b92; --rule: #1e2a40; --grid: #18233a;
  --accent: #5b9dff; --line: #6aa8ff; --area: rgba(106, 168, 255, .16);
  --inc: #9ee858; --exp: #ff6b4a; --pend: #b794ff; --pend-bg: #2a2146;
}
.c-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 0; }
.c-top .m { display: flex; flex-direction: column; }
.c-top .m b { font-size: 16px; font-weight: 700; }
.c-top .m small { font-size: 12px; color: var(--fg3); }
.c-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); display: grid; place-items: center; color: var(--fg2); cursor: pointer; }
.c-btn svg { width: 20px; height: 20px; }
.c-hero { margin: 12px 12px 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 16px 16px 8px; }
.c-hero .lab { font-size: 12.5px; color: var(--fg2); display: flex; justify-content: space-between; }
.c-hero .bal { font-size: 34px; font-weight: 800; margin: 4px 0 0; letter-spacing: -.3px; }
.c-hero .bal small { font-size: 13px; font-weight: 500; color: var(--fg3); margin-right: 6px; letter-spacing: 0; }
.c-delta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg2); margin-top: 4px; }
.c-delta b { font-weight: 700; }
.c-chart { margin-top: 8px; }
.c-chart svg, .c-panel svg { width: 100%; height: auto; display: block; direction: ltr; }
.c-chart text, .c-panel svg text { fill: var(--fg3); font-size: 10px; font-family: var(--f-ui); }
.c-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--fg2); padding: 4px 0 6px; flex-wrap: wrap; }
.c-legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--line); vertical-align: middle; margin-left: 5px; }
.c-legend i.dash { border-top-style: dashed; border-color: var(--pend); }
.c-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 12px 0; }
.c-kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.c-kpi span { font-size: 11.5px; color: var(--fg2); }
.c-kpi b { font-size: 15px; font-weight: 700; }
.c-kpi small { font-size: 11px; color: var(--fg3); }
.c-panel { margin: 8px 12px 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 14px 16px; }
.c-panel h2 { font-size: 14px; font-weight: 700; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
.c-panel h2 small { font-size: 11.5px; color: var(--fg3); font-weight: 500; }
.c-stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.c-cats { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.c-cats li { display: flex; justify-content: space-between; font-size: 12.5px; gap: 6px; }

    var parts = [[expOk, 'var(--exp)', 'برداشت شده'], [expP, 'var(--pend)', 'پرداخت‌نشده'], [Math.max(0, incOk - expOk), 'var(--tq)', 'باقی از درآمد']];
    var tot = parts.reduce(function (s, p) { return s + p[0]; }, 0), acc = 0, r = 38, C = 2 * Math.PI * r;
    var arcs = parts.map(function (p) { var len = p[0] / tot * C, s = '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="' + p[1] + '" stroke-width="10" stroke-dasharray="' + Math.max(0, len - 3) + ' ' + C + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 46 46)" stroke-linecap="round"/>'; acc += len; return s; }).join('');
    var pct = Math.round((expOk + expP) / incOk * 100);
    return '<div class="b-ring"><svg viewBox="0 0 92 92">' + '<circle cx="46" cy="46" r="38" fill="none" stroke="var(--rule)" stroke-width="10"/>' + arcs +
      '<text x="46" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="var(--fg)" font-family="Vazirmatn">' + fa(pct) + '٪</text><text x="46" y="60" text-anchor="middle" font-size="9" fill="var(--fg3)" font-family="Vazirmatn">از درآمد</text></svg>' +
      '<ul>' + parts.map(function (p) { return '<li><span><i style="background:' + p[1] + '"></i>' + p[2] + '</span><b class="num">' + mil(p[0]) + '</b></li>'; }).join('') + '</ul></div>';
  }
  function homeB() {
    var due = TX.filter(function (x) { return x.pend; });
    return '<div class="b-top"><h1 class="b-greet">عصر بخیر<small>' + MONTH + '، هشتمین روز ماه</small></h1><button type="button" class="b-avatar" aria-label="حساب کاربری">' + I('user') + '</button></div>' +
      '<section class="b-hero">' + girih + '<p class="lab">موجودی همهٔ حساب‌ها</p><p class="bal num">' + money(total) + '<small>تومان</small></p>' +
      '<div class="row"><div class="pill"><span>واریز این ماه</span><b class="num in">' + mil(incOk) + '</b></div><div class="pill"><span>برداشت این ماه</span><b class="num">' + mil(expOk) + '</b></div></div></section>' +
      '<div class="b-sec"><h2 class="b-h2">در انتظار تسویه</h2><button type="button" data-go="tx" data-setf="pend">همه</button></div>' +
      '<div class="b-due">' + due.map(function (x) {
        return '<div class="b-due-it"><span class="b-ico ' + (x.type === 'inc' ? 'inc' : '') + '">' + I(x.cat) + '</span><span class="t"><b>' + x.desc + '</b><small>' + (x.type === 'inc' ? 'دریافت‌نشده' : 'پرداخت‌نشده') + '، از ' + fa(x.d) + ' آبان</small></span><span class="v num ltr" style="color:var(--' + x.type + ')">' + sgn(x) + '</span></div>';
      }).join('') + '</div>' +
      '<div class="b-sec"><h2 class="b-h2">این ماه تا امروز</h2></div>' + ringB() +
      '<div class="b-sec"><h2 class="b-h2">تراکنش‌های اخیر</h2><button type="button" data-go="tx">همه</button></div>' + txListB(TX.slice(0, 4)) + '<div style="height:16px"></div>';
  }
  function txB() {
    return '<div class="b-top"><h1 class="b-greet">تراکنش‌ها<small>' + MONTH + '</small></h1><button type="button" class="b-avatar" aria-label="حساب کاربری">' + I('user') + '</button></div>' +
      '<div class="b-searchrow"><div class="b-search">' + I('search') + 'جستجو در شرح، حساب یا مبلغ</div><button type="button" class="b-filterbtn" aria-label="فیلترهای بیشتر">' + I('filter') + '</button></div>' +
      '<div class="b-chips">' + FL.map(function (f) { return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (state.f === f[0]) + '">' + f[1] + ' ' + '<span class="num">' + fa(counts[f[0]]) + '</span></button>'; }).join('') + '</div>' +
      '<div class="b-totals"><div><span>واریز</span><b class="num">' + mil(incOk) + '</b></div><div><span>برداشت</span><b class="num">' + mil(expOk) + '</b></div><div><span>در انتظار</span><b class="num">' + mil(incP + expP) + '</b></div></div>' +
      txListB(filtered()) + '<div style="height:16px"></div>';
  }

  /* ============ طرح ۳ ============ */
  function navC() {
    var it = [['home', 'chart', 'پیشخوان'], ['tx', 'list', 'تراکنش‌ها'], ['add', 'plus', ''], ['rep', 'search', 'جستجو'], ['more', 'more', 'بیشتر']];
    return '<nav class="c-nav" aria-label="ناوبری">' + it.map(function (x) {
      if (x[0] === 'add') return '<button type="button" class="add" aria-label="ثبت تراکنش"><span>' + I('plus', 2.2) + '</span></button>';
      return '<button type="button" data-go="' + x[0] + '"' + (state.s === x[0] ? ' aria-current="page"' : '') + '>' + I(x[1]) + x[2] + '</button>';
    }).join('') + '</nav>';
  }
  function chartC() {
    /* زمان راست‌به‌چپ: روز ۱ سمت راست، پایان ماه سمت چپ. خط پر = واقعی تا امروز؛ خط‌چین = پیش‌بینی با تسویه‌نشده‌ها */
    var W = 340, H = 130, pl = 6, pr = 34, pt = 10, pb = 22, endD = 30;
    var vals = series.concat([projected]), lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = (hi - lo) * .15; lo -= pad; hi += pad;
    var x = function (d) { return W - pr - (d - 1) / (endD - 1) * (W - pr - pl); };
    var y = function (v) { return pt + (hi - v) / (hi - lo) * (H - pt - pb); };
    var pts = series.map(function (v, i) { return x(i + 1).toFixed(1) + ',' + y(v).toFixed(1); });
    var area = 'M' + x(1) + ',' + (H - pb) + ' L' + pts.join(' L') + ' L' + x(TODAY) + ',' + (H - pb) + 'Z';
    var ticks = [lo + (hi - lo) * .2, lo + (hi - lo) * .5, lo + (hi - lo) * .8];
    var g = ticks.map(function (t) { return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (W - 2) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + mil(t) + '</text>'; }).join('');
    var xl = [1, 8, 15, 22, 30].map(function (d) { return '<text x="' + x(d) + '" y="' + (H - 6) + '" text-anchor="middle">' + fa(d) + '</text>'; }).join('');
    return '<div class="c-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="موجودی روزانهٔ آبان">' + g + xl +
      '<path d="' + area + '" fill="var(--area)"/><polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--line)" stroke-width="2.2" stroke-linejoin="round"/>' +
      '<line x1="' + x(TODAY) + '" y1="' + y(total) + '" x2="' + x(endD) + '" y2="' + y(projected) + '" stroke="var(--pend)" stroke-width="2" stroke-dasharray="5 4"/>' +
      '<circle cx="' + x(TODAY) + '" cy="' + y(total) + '" r="4.5" fill="var(--surface)" stroke="var(--line)" stroke-width="2.2"/>' +
      '<circle cx="' + x(endD) + '" cy="' + y(projected) + '" r="3.5" fill="var(--pend)"/></svg>' +
      '<div class="c-legend"><span><i></i>موجودی واقعی</span><span><i class="dash"></i>با تسویه‌نشده‌ها: <b class="num">' + money(projected) + '</b></span></div></div>';
  }
  function flowC() {
    var W = 320, H = 120, mid = 58, max = 50, bw = 14;
    var col = function (i) { return W - 26 - i * ((W - 40) / 5); };
    var bars = SIX.map(function (m, i) {
      var cx = col(i), hi = m[1] / max * (mid - 8), he = m[2] / max * (mid - 8);
      return '<rect x="' + (cx - bw / 2) + '" y="' + (mid - hi) + '" width="' + bw + '" height="' + hi + '" rx="3" fill="var(--inc)"/>' +
        '<rect x="' + (cx - bw / 2) + '" y="' + (mid + 2) + '" width="' + bw + '" height="' + he + '" rx="3" fill="var(--exp)" opacity=".85"/>' +
        '<text x="' + cx + '" y="' + (H - 2) + '" text-anchor="middle">' + m[0] + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="واریز و برداشت شش ماه اخیر"><line x1="8" x2="' + (W - 8) + '" y1="' + (mid + 1) + '" y2="' + (mid + 1) + '" stroke="var(--rule)"/>' + bars + '</svg>';
  }
  function catsC() {
    var m = {}; TX.forEach(function (x) { if (x.type === 'exp') m[x.cat] = (m[x.cat] || 0) + x.amt; });
    var ks = Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).slice(0, 6), tot = ks.reduce(function (s, k) { return s + m[k]; }, 0);
    var pal = ['var(--accent)', 'var(--pend)', '#14b8a6', '#f59e0b', '#ec4899', 'var(--fg3)'];
    return '<div class="c-stack">' + ks.map(function (k, i) { return '<span style="flex:' + m[k] + ';background:' + pal[i] + '"></span>'; }).join('') + '</div>' +
      '<ul class="c-cats">' + ks.map(function (k, i) { return '<li><span><i style="background:' + pal[i] + '"></i>' + CAT[k] + '</span><b class="num">' + fa(Math.round(m[k] / tot * 100)) + '٪</b></li>'; }).join('') + '</ul>';
  }
  function homeC() {
    var prevBal = 57100000, dlt = total - prevBal;
    return '<div class="c-top"><div class="m"><b>پیشخوان</b><small>' + MONTH + '، تا ' + fa(TODAY) + 'ام</small></div><button type="button" class="c-btn" aria-label="اعلان‌ها">' + I('bell') + '</button></div>' +
      '<section class="c-hero"><div class="lab"><span>موجودی همهٔ حساب‌ها</span><span>تومان</span></div><p class="bal num">' + money(total) + '</p>' +
      '<div class="c-delta"><span>نسبت به پایان مهر <b class="num ltr" style="color:var(--inc)">+' + money(dlt) + '</b></span><span>تسویه‌نشده <b class="num">' + fa(pendN) + ' مورد</b></span></div>' + chartC() + '</section>' +
      '<div class="c-kpis"><div class="c-kpi"><span>ورودی</span><b class="num" style="color:var(--inc)">' + mil(incOk) + '</b><small>+' + mil(incP) + ' در انتظار</small></div>' +
      '<div class="c-kpi"><span>خروجی</span><b class="num" style="color:var(--exp)">' + mil(expOk) + '</b><small>+' + mil(expP) + ' در انتظار</small></div>' +
      '<div class="c-kpi"><span>خالص ماه</span><b class="num">' + mil(incOk - expOk) + '</b><small>نرخ پس‌انداز ' + fa(Math.round((incOk - expOk) / incOk * 100)) + '٪</small></div></div>' +
      '<section class="c-panel"><h2>جریان نقدی<small>شش ماه اخیر، میلیون تومان</small></h2>' + flowC() + '</section>' +
      '<section class="c-panel"><h2>برداشت به تفکیک دسته<small>آبان</small></h2>' + catsC() + '</section>' +
      '<section class="c-panel"><h2>حساب‌ها<small>سهم از موجودی</small></h2>' + ACCOUNTS.map(function (a) { return '<div class="c-acc"><span>' + a.name + '</span><span class="bar"><i style="width:' + (a.bal / total * 100).toFixed(1) + '%"></i></span><b class="num">' + mil(a.bal) + '</b></div>'; }).join('') + '</section><div style="height:14px"></div>';
  }
  function txC() {
    var l = filtered(), ds = []; l.forEach(function (x) { if (ds.indexOf(x.d) < 0) ds.push(x.d); });
    var maxNet = Math.max.apply(null, days.map(function (d) { return Math.abs(dayNet(d)); }));
    var rows = ds.map(function (d) {
      var net = dayNet(d), w = Math.max(4, Math.abs(net) / maxNet * 60);
      return '<div class="c-dayrow"><span>' + dayLabel(d) + '</span><span class="net"><i style="width:' + w + 'px;background:' + (net >= 0 ? 'var(--inc)' : 'var(--exp)') + '"></i><span class="num ltr">' + (net >= 0 ? '+' : '−') + money(Math.abs(net)) + '</span></span></div>' +
        byDay(d, l).map(function (x) {
          var i = TX.indexOf(x);
          return '<div class="c-row' + (x.pend ? ' is-pend' : '') + '"><span class="t"><b>' + x.desc + '</b><small><span>' + x.acc + '</span><span class="num">' + fa(x.t) + '</span><span>' + CAT[x.cat] + '</span>' + (x.pend ? '<span class="c-pend">' + (x.type === 'inc' ? 'دریافت‌نشده' : 'پرداخت‌نشده') + '</span>' : '') + '</small></span>' +
            '<span class="v num ' + x.type + '"><span class="ltr">' + sgn(x) + '</span></span><span class="rb num">' + (x.pend ? '—' : money(running[i])) + '</span></div>';
        }).join('');
    }).join('');
    return '<div class="c-top"><div class="m"><b>تراکنش‌ها</b><small>' + MONTH + '، ' + fa(TX.length) + ' مورد</small></div><button type="button" class="c-btn" aria-label="جستجو">' + I('search') + '</button></div>' +
      '<div class="c-filters">' + FL.map(function (f) { return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (state.f === f[0]) + '">' + f[1] + '<em class="num">' + fa(counts[f[0]]) + '</em></button>'; }).join('') + '<button type="button">حساب: همه</button><button type="button">دسته: همه</button></div>' +
      '<div class="c-strip"><div><span>ورودی</span><b class="num" style="color:var(--inc)">' + mil(incOk) + '</b></div><div><span>خروجی</span><b class="num" style="color:var(--exp)">' + mil(expOk) + '</b></div><div><span>تسویه‌نشده</span><b class="num" style="color:var(--pend)">' + mil(incP + expP) + '</b></div></div>' +
      '<div class="c-table"><div class="c-thead"><span>شرح</span><span>مبلغ</span><span>مانده پس از آن</span></div>' + rows + '</div><div style="height:14px"></div>';
  }

  /* ---------- رندر ---------- */
  var phone = document.getElementById('phone');
  function render() {
    var R = { a: [homeA, txA, navA], b: [homeB, txB, navB], c: [homeC, txC, navC] }[state.d];
    var screen = state.s === 'tx' ? R[1] : R[0];
    phone.setAttribute('data-d', state.d); phone.setAttribute('data-m', state.m);
    phone.innerHTML = status + '<div class="scroll" id="scroll">' + screen() + '</div>' + R[2]();
    [['segD', 'd'], ['segS', 's'], ['segM', 'm']].forEach(function (p) {
      document.querySelectorAll('#' + p[0] + ' button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === state[p[1]])); });
    });
    try { localStorage.setItem('hk-proto', JSON.stringify(state)); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button'); if (!b) return;
    var seg = b.parentElement && b.parentElement.id;
    if (seg === 'segD') { state.d = b.dataset.v; state.f = 'all'; }
    else if (seg === 'segS') state.s = b.dataset.v;
    else if (seg === 'segM') state.m = b.dataset.v;
    else if (b.dataset.f) state.f = b.dataset.f;
    else if (b.dataset.go === 'home' || b.dataset.go === 'tx') { state.s = b.dataset.go; if (b.dataset.setf) state.f = b.dataset.setf; }
    else return;
    var sc = document.getElementById('scroll'), keep = b.dataset.f && sc ? sc.scrollTop : 0;
    render();
    var sc2 = document.getElementById('scroll'); if (sc2) sc2.scrollTop = keep;
  });
  render();
})();
</script>
</body>
</html>
